name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Universal DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "Tag: ${TAG}, Version: ${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./scripts/test.sh

      - name: Build Universal .app and verify .dmg
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          UNIVERSAL: '1'
        run: ./scripts/package-dmg.sh

      - name: Stage release assets and SHA256SUMS.txt
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp "build/LiteMouse-${VERSION}-macos-universal.dmg" "dist/"
          (cd dist && shasum -a 256 LiteMouse-* > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## LiteMouse ${TAG}

          Ultra-lightweight native macOS mouse utility (pure AppKit, zero external dependencies, Universal binary for Apple Silicon & Intel).

          ### Downloads
          - **macOS 14+ (Universal — Apple Silicon & Intel):** \`LiteMouse-${VERSION}-macos-universal.dmg\` *(ad-hoc signed; go to **System Settings › Privacy & Security → Open Anyway** on first launch, then grant **Accessibility** permission)*
          - **Checksums:** \`SHA256SUMS.txt\`

          ---

          ### 下载说明
          - **macOS 14+（Universal 通用版，支持 Apple 芯片与 Intel）**：\`LiteMouse-${VERSION}-macos-universal.dmg\`（本机签名，首次打开请在「系统设置 › 隐私与安全性」中点击「仍要打开」，随后授予「辅助功能」权限）
          - **校验和**：\`SHA256SUMS.txt\`
          EOF

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "LiteMouse ${TAG}" \
              --notes-file release-notes.md
          fi
